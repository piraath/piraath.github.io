<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories | Pirasanth & Shankavie</title>

  <style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --gold: #d5aa57;
    --deep-gold: #9f762f;
    --cream: #fff8ee;
    --brown: #251207;
    --text: #3a2415;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    background: var(--cream);
    color: var(--text);
    text-align: center;
  }

  .topbar {
    padding: 26px 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--brown);
  }

  .logo {
    color: var(--gold);
    font-size: 28px;
    letter-spacing: 7px;
    font-weight: 500;
  }

  nav {
    display: flex;
    gap: 34px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  nav a {
    color: rgba(255,255,255,0.9);
    text-decoration: none;
  }

  nav a:hover {
    color: var(--gold);
  }

  main {
  min-height: calc(100vh - 90px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 70px 30px;
}

/* GRANDE CARTE */

.memory-card {
  position: relative;
  width: min(1050px, 100%);
  min-height: 650px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 70px 40px;

  border-radius: 18px;
  overflow: hidden;

  border: 1px solid rgba(159,118,47,.40);

  box-shadow:
    0 25px 70px rgba(72,42,18,.13),
    inset 0 0 0 7px rgba(255,248,238,.65);

  background:
  linear-gradient(
    rgba(255,248,238,.80),
    rgba(255,248,238,.85)
  ),
  url("images/couple.jpg");

  background-size: cover;
  background-position: center;
}

/* PETIT CADRE DORÉ INTÉRIEUR */

.memory-card::after {
  content: "";
  position: absolute;
  inset: 15px;
  border: 1px solid rgba(213,170,87,.45);
  border-radius: 11px;
  pointer-events: none;
}

/* CONTENU */

.memory-content {
  position: relative;
  z-index: 2;
  max-width: 700px;
  width: 100%;
}

.memory-eyebrow {
  font-family: "Inter", sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--deep-gold);
  margin-bottom: 22px;
}

h1 {
  font-family: "Bodoni Moda", serif;
  font-size: 54px;
  font-weight: 400;
  margin: 0 0 18px;
}

.intro {
  font-size: 21px;
  line-height: 1.55;
  margin: 0 auto;
}

.ornament {
  color: var(--gold);
  font-size: 24px;
  margin: 20px 0;
}

/* QR */

.qr-wrap {
  margin: 15px auto 0;
  padding: 13px;
  width: fit-content;

  background: rgba(255,255,255,.94);

  border-radius: 12px;
  border: 1px solid rgba(213,170,87,.25);

  box-shadow: 0 12px 35px rgba(72,42,18,.12);
}

.qr-wrap img {
  display: block;
  width: 180px;
  height: 180px;
}

/* BOUTON */

.btn {
  display: inline-block;

  margin-top: 30px;
  padding: 18px 44px;

  background: linear-gradient(180deg,#e7bc65,#c99841);

  color: #2b1609;
  text-decoration: none;

  border-radius: 7px;

  font-family: "Inter", sans-serif;
  font-size: 11px;
  font-weight: 600;

  letter-spacing: 3px;
  text-transform: uppercase;

  box-shadow: 0 15px 35px rgba(80,45,15,.17);

  transition: all .35s ease;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 20px 45px rgba(80,45,15,.22);
}

.private-note {
  margin-top: 20px;

  font-family: "Inter", sans-serif;
  font-size: 13px;

  color: #7b6657;
}

  @media (max-width: 700px) {

  .topbar {
    padding: 22px 25px;
    flex-direction: column;
    gap: 18px;
  }

  nav {
    gap: 18px;
    font-size: 10px;
  }

  main {
    padding: 30px 15px;
  }

  .memory-card {
    min-height: auto;
    padding: 55px 22px;
    border-radius: 14px;
  }

  .memory-card::after {
    inset: 9px;
  }

  h1 {
    font-size: 39px;
  }

  .intro {
    font-size: 18px;
  }

  .qr-wrap img {
    width: 165px;
    height: 165px;
  }
}
  }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">P & S</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="infos.html">Infos</a>
      <a href="memories.html">Memories</a>
    </nav>
  </div>

  <main>
    <main>
  <div class="memory-card">

    <div class="memory-content">

      <div class="memory-eyebrow">P & S · 31 OCTOBER 2026</div>

      <h1>Share Your Memories</h1>

      <p class="intro">
        Help us capture our special day through your eyes.<br>
        Share your favourite photos and videos with us.
      </p>

      <div class="ornament">♡</div>

      <div class="qr-wrap">
        <img
          src="wedding-upload-qr.png"
          alt="QR code to upload wedding photos and videos"
        />
      </div>

      <a
        class="btn"
        href="https://www.dropbox.com/request/c42fzfps639uzr42k158"
        target="_blank"
        rel="noopener noreferrer"
      >
        Upload Photos & Videos
      </a>

      <div class="private-note">
        Your uploads are private and will only be accessible to us.
      </div>

    </div>

  </div>
</main>

</body>
</html>
