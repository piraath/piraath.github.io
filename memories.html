<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memories | Pirasanth & Shankavie</title>

  <style>
  @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --gold: #d5aa57;
    --deep-gold: #9f762f;
    --cream: #fff8ee;
    --brown: #251207;
    --text: #3a2415;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    background: var(--cream);
    color: var(--text);
    text-align: center;
  }

  .topbar {
    padding: 26px 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--brown);
  }

  .logo {
    color: var(--gold);
    font-size: 28px;
    letter-spacing: 7px;
    font-weight: 500;
  }

  nav {
    display: flex;
    gap: 34px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  nav a {
    color: rgba(255,255,255,0.9);
    text-decoration: none;
  }

  nav a:hover {
    color: var(--gold);
  }

  main {
    min-height: calc(100vh - 90px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 65px 25px;
  }

  .memories {
    max-width: 760px;
  }

  h1 {
    font-family: "Bodoni Moda", serif;
    font-size: 52px;
    font-weight: 400;
    margin: 0 0 20px;
  }

  .intro {
    font-size: 22px;
    line-height: 1.55;
    margin: 0 auto 25px;
  }

  .qr-wrap {
    margin: 40px auto 15px;
    padding: 18px;
    width: fit-content;
    background: white;
    border-radius: 14px;
    box-shadow: 0 14px 45px rgba(80,45,15,0.12);
    border: 1px solid rgba(200,155,75,0.2);
  }

  .qr-wrap img {
    display: block;
    width: 220px;
    height: 220px;
  }

  .btn {
    display: inline-block;
    margin-top: 55px;
    padding: 20px 48px;
    background: linear-gradient(180deg,#e7bc65,#c99841);
    color: #2b1609;
    text-decoration: none;
    border-radius: 8px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    box-shadow: 0 18px 40px rgba(80,45,15,.15);
    transition: all .35s ease;
  }

  .btn:hover {
    transform: translateY(-4px);
  }

  .private-note {
    margin-top: 25px;
    font-size: 16px;
    font-family: "Inter", sans-serif;
    color: #7b6657;
  }

  @media (max-width: 700px) {
    .topbar {
      padding: 22px 25px;
      flex-direction: column;
      gap: 18px;
    }

    nav {
      gap: 18px;
      font-size: 10px;
    }

    h1 {
      font-size: 40px;
    }

    .intro {
      font-size: 19px;
    }

    .qr-wrap img {
      width: 190px;
      height: 190px;
    }
  }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">P & S</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="infos.html">Infos</a>
      <a href="memories.html">Memories</a>
    </nav>
  </div>

  <main>
    <div class="memories">

      <h1>Share Your Memories</h1>

      <p class="intro">
        Help us capture our special day through your eyes.
        Share your favourite photos and videos with us.
      </p>

      <div class="qr-wrap">
        <img
          src="wedding-upload-qr.png"
          alt="QR code to upload wedding photos and videos"
        />
      </div>

      <a
        class="btn"
        href="https://www.dropbox.com/request/c42fzfps639uzr42k158"
        target="_blank"
        rel="noopener noreferrer"
      >
        Upload Photos & Videos
      </a>

      <div class="private-note">
        Your uploads are private and will only be accessible to us.
      </div>

    </div>
  </main>

</body>
</html>
